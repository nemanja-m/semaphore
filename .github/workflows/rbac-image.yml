name: Build rbac images

on:
  push:
    branches:
      - ci/rbac-image-build
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        edition: [ce, ee]
        arch: [amd64, arm64]
    # Native runners: Erlang builds are unreliable under QEMU emulation.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      IMAGE: nemanjam/semaphore-rbac-${{ matrix.edition }}
      DIR: ${{ matrix.edition == 'ce' && 'rbac/ce' || 'ee/rbac' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.DIR }}
          file: ${{ env.DIR }}/Dockerfile
          target: runner
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_NAME=rbac
            BUILD_ENV=prod
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=rbac-${{ matrix.edition }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rbac-${{ matrix.edition }}-${{ matrix.arch }}

  # One tag per edition for both architectures: Docker pulls the one matching the host.
  manifest:
    needs: build
    strategy:
      matrix:
        edition: [ce, ee]
    runs-on: ubuntu-latest
    env:
      IMAGE: nemanjam/semaphore-rbac-${{ matrix.edition }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: >-
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA"
          "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
